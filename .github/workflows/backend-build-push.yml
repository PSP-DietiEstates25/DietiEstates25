name: Build & Push Backend Images (ACR)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ${{ secrets.ACR_LOGIN_SERVER }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: authorization-server
            workdir: code/authorization-server
            image: authorization-server
          - name: resource-server
            workdir: code/resource-server
            image: resource-server
          - name: bff
            workdir: code/backed-for-frontend
            image: bff

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Login to ACR
        uses: azure/docker-login@v2
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build OCI image with Spring Boot Buildpacks
        working-directory: ${{ matrix.workdir }}
        run: |
          IMAGE_SHA="${REGISTRY}/${{ matrix.image }}:${GITHUB_SHA}"
          IMAGE_LATEST="${REGISTRY}/${{ matrix.image }}:latest"
          ./gradlew bootBuildImage --imageName "${IMAGE_SHA}"
          docker tag "${IMAGE_SHA}" "${IMAGE_LATEST}"

      - name: Push
        run: |
          docker push "${REGISTRY}/${{ matrix.image }}:${GITHUB_SHA}"
          docker push "${REGISTRY}/${{ matrix.image }}:latest"
