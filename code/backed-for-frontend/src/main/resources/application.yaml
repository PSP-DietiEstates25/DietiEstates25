            #GET /notificationcategories/{notificationcategoryname}/notifications/{notificationid}
            - id: resource_server_get_notification_by_id
              uri: http://localhost:8090
              predicates:
                - Path=/notificationcategories/{notificationcategoryname}/notifications/{notificationid}
