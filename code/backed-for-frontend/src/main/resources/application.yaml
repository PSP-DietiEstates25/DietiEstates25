server:
  port: 8080
  servlet:
    session:
      cookie:
        name: BFFSESSION
        http-only: true
        secure: false
        same-site: LAX

logging:
  level:
    root: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG

spring:
  application:
    name: backend-for-frontend
  datasource:
    url: jdbc:postgresql://localhost:5432/dietiestates_bff_server
    username: dietiestates
    password: dietiestates
    driver-class-name: org.postgresql.Driver
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: always
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update   # oppure 'validate' in prod
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  security:
    oauth2:
      client:
        registration:
          messaging-client-oidc:
            provider: spring
            client-id: dietiestates
            client-secret: secret
            client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code
            redirect-uri: "http://localhost:8080/login/oauth2/code/{registrationId}"
            scope: openid,profile
            client-name: messaging-client-oidc
          messaging-client-authorization-code:
            provider: spring
            client-id: dietiestates
            client-secret: secret
            client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code
            redirect-uri: "http://localhost:8080/authorized"
            scope: message.read,message.write
            client-name: messaging-client-authorization-code
        provider:
          spring:
            issuer-uri: https://localhost:9443
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            # AUTH SERVER /auth/login
            - id: auth_server_userinfo
              uri: https://localhost:9443
              predicates:
                - Path=/userinfo
              filters:
                - TokenRelay=
                - RemoveRequestHeader=Cookie

            # AUTH SERVER /account/password
            - id: auth_server_account_password
              uri: https://localhost:9443
              predicates:
                - Path=/account/password
              filters:
                - TokenRelay=
                - RemoveRequestHeader=Cookie

            # /auth/register
            - id: auth_server_register_account
              uri: https://localhost:9443
              predicates:
                - Path=/auth/register

            # RESOURCE SERVER
            # Swagger UI (springdoc default)
            - id: resource_server_swagger_ui
              uri: http://localhost:8090
              predicates:
                - Path=/swagger-ui/**,/api/v1/swagger-ui.html

            # OpenAPI JSON (springdoc default v3)
            - id: resource_server_openapi_json
              uri: http://localhost:8090
              predicates:
                - Path=/v3/api-docs/**

            # (Opzionale ma utile) swagger-config usato dalla UI
            - id: resource_server_swagger_config
              uri: http://localhost:8090
              predicates:
                - Path=/v3/api-docs/swagger-config

            #POST /users
            - id: resource_server_register_user
              uri: http://localhost:8090
              predicates:
                - Path=/users
                - Method=POST

            #GET /users/{userid}
            - id: resource_server_get_user_by_id
              uri: http://localhost:8090
              predicates:
                - Path=/users/{userid}
                - Method=GET
              filters:
                - RelayTokenIfExists=messaging-client-oidc

            #POST,GET /admins
            - id: resource_server_register_admin
              uri: http://localhost:8090
              predicates:
                - Path=/admins
                - Method=POST,GET
              filters:
                - RelayTokenIfExists=messaging-client-oidc

            # GET /admins/{adminid}
            - id: resource_server_get_admin_by_id
              uri: http://localhost:8090
              predicates:
                - Path=/admins/{adminid}
                - Method=GET
              filters:
                - RelayTokenIfExists=messaging-client-oidc

            #POST /estateagents
            - id: resource_server_register_estate_agents
              uri: http://localhost:8090
              predicates:
                - Path=/estateagents
                - Method=POST
              filters:
                - RelayTokenIfExists=messaging-client-oidc

            #GET /estateagents/{estateagentid}
            - id: resource_server_register_get_estate_agent_by_id
              uri: http://localhost:8090
              predicates:
                - Path=/estateagents/{estateagentid}
                - Method=GET
              filters:
                - RelayTokenIfExists=messaging-client-oidc

            #POST,GET /realestates
            - id: resource_server_real_estates
              uri: http://localhost:8090
              predicates:
                - Path=/realestates
                - Method=POST,GET
              filters:
                - RelayTokenIfExists=messaging-client-oidc
                - RemoveRequestHeader=Cookie

            #GET,PUT,DELETE realestates/{realestateid}
            - id: resource_server_get_put_delete_real_estate_by_id
              uri: http://localhost:8090
              predicates:
                - Path=/realestates/{realestateid}
                - Method=GET,PUT,DELETE
              filters:
                - RelayTokenIfExists=messaging-client-oidc
                - RemoveRequestHeader=Cookie

            #GET /images
            - id: resource_server_realestate_images
              uri: http://localhost:8090
              predicates:
                - Path=/images/**
              filters:
                - RelayTokenIfExists=messaging-client-oidc
                - RemoveRequestHeader=Cookie

            #POST,GET /searches
            - id: resource_server_searches
              uri: http://localhost:8090
              predicates:
                - Path=/searches
                - Method=POST,GET
              filters:
                - RelayTokenIfExists=messaging-client-oidc

            #POST /detais
            - id: resource_server_details
              uri: http://localhost:8090
              predicates:
                - Path=/details
                - Method=POST
              filters:
                - RelayTokenIfExists=messaging-client-oidc

            #GET,PUT /details/{detailid}
            - id: resource_server_get_put_detail_by_id
              uri: http://localhost:8090
              predicates:
                - Path=/details/{detailid}
                - Method=GET,PUT
              filters:
                - RelayTokenIfExists=messaging-client-oidc

            #POST,GET /geographicalpositions
            - id: resource_server_geographical_positions
              uri: http://localhost:8090
              predicates:
                - Path=/geographicalpositions
                - Method=POST,GET
              filters:
                - RelayTokenIfExists=messaging-client-oidc

            #GET,PUT /geographicalpositions/{geographicalpositionid}
            - id: resource_server_get_put_geographical_position_by_id
              uri: http://localhost:8090
              predicates:
                - Path=/geographicalpositions/{geographicalpositionid}
                - Method=GET,PUT
              filters:
                - RelayTokenIfExists=messaging-client-oidc

            #POST,GET /utilities
            - id: resource_server_utilities
              uri: http://localhost:8090
              predicates:
                - Path=/utilities
                - Method=POST,GET
              filters:
                - RelayTokenIfExists=messaging-client-oidc

            #GET,PUT /utilities/{utilityid}
            - id: resource_server_get_put_utility_by_id
              uri: http://localhost:8090
              predicates:
                - Path=/utilities/{utilityid}
                - Method=POST,GET
              filters:
                - RelayTokenIfExists=messaging-client-oidc

            #POST,GET /cadastraldata
            - id: resource_server_cadastral_data
              uri: http://localhost:8090
              predicates:
                - Path=/cadastraldata
                - Method=POST,GET
              filters:
                - RelayTokenIfExists=messaging-client-oidc

            #GET,PUT /cadastraldata/{cadastraldataid}
            - id: resource_server_get_put_cadastral_data_by_id
              uri: http://localhost:8090
              predicates:
                - Path=/cadastraldata/{cadastraldataid}
                - Method=GET,PUT
              filters:
                - RelayTokenIfExists=messaging-client-oidc

            #POST,GET /cadastralfilters
            - id: resource_server_cadastral_filters
              uri: http://localhost:8090
              predicates:
                - Path=/cadastralfilters
                - Method=POST,GET
              filters:
                - RelayTokenIfExists=messaging-client-oidc

            #GET /cadastralfilters/{cadastralfilterid}
            - id: resource_server_get_put_cadastral_filter_by_id
              uri: http://localhost:8090
              predicates:
                - Path=/cadastralfilters/{cadastralfilterid}
                - Method=GET
              filters:
                - RelayTokenIfExists=messaging-client-oidc

            #POST,GET /offers
            - id: resource_server_realestate_offers
              uri: http://localhost:8090
              predicates:
                - Path=/offers
                - Method=POST,GET
              filters:
                - RelayTokenIfExists=messaging-client-oidc

            #GET,PATCH /offers/{offerid}
            - id: resource_server_get_patch_offer_by_id
              uri: http://localhost:8090
              predicates:
                - Path=/offers/{offerid}
                - Method=GET,PATCH
              filters:
                - RelayTokenIfExists=messaging-client-oidc

            #POST,GET /realestates/{realestateid}/visits
            - id: resource_server_realestate_visits
              uri: http://localhost:8090
              predicates:
                - Path=/realestates/{realestateid}/visits
                - Method=POST,GET
              filters:
                - RelayTokenIfExists=messaging-client-oidc

            #GET,PATCH /realestates/{realestateid}/visits/{visitid}
            - id: resource_server_get_patch_visit_by_id
              uri: http://localhost:8090
              predicates:
                - Path=/realestates/{realestateid}/visits/{visitid}
                - Method=GET,PATCH
              filters:
                - RelayTokenIfExists=messaging-client-oidc

            #POST,GET /notificationcategories
            - id: resource_server_notification_categories
              uri: http://localhost:8090
              predicates:
                - Path=/notificationcategories
                - Method=POST,GET
              filters:
                - RelayTokenIfExists=messaging-client-oidc

            #GET,PUT /notificationcategories/{notificationcategoryname}
            - id: resource_server_get_put_notification_category_by_name
              uri: http://localhost:8090
              predicates:
                - Path=/notificationcategories/{notificationcategoryname}
                - Method=GET,PUT
              filters:
                - RelayTokenIfExists=messaging-client-oidc

            #POST,GET /notificationcategories/{notificationcategoryname}/notifications
            - id: resource_server_notification_category_notifications
              uri: http://localhost:8090
              predicates:
                - Path=/notificationcategories/{notificationcategoryname}/notifications
