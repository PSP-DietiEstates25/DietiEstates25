services:
  postgres:
    container_name: postgres-sql-dietiestates
    image: postgres:latest
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - postgres:/data/postgres
    ports:
      - 5432:5432
    networks:
      - spring-backend
    restart: unless-stopped

networks:
  spring-backend:
    driver: bridge

volumes:
  postgres:
    driver: local