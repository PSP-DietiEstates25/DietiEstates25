services:
  postgres_sonarqube:
    container_name: postgres_sonarqube
    image: postgres:latest
    environment:
      POSTGRES_DB: sonarqube_database
      POSTGRES_USER: sonarqube
      POSTGRES_PASSWORD: sonarqube
    volumes:
      - postgres_sonarqube:/var/lib/postgresql/data
    ports:
      - 5434:5432
    networks:
      - spring-backend
    restart: unless-stopped

  sonarqube:
    container_name: sonarqube_dietiestates
    image: sonarqube:latest
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://postgres_sonarqube:5432/sonarqube_database
      SONAR_JDBC_USERNAME: sonarqube
      SONAR_JDBC_PASSWORD: sonarqube
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    ports:
      - 9000:9000
    networks:
      - spring-backend
    restart: unless-stopped    

networks:
  spring-backend:
    driver: bridge

volumes:
  postgres_sonarqube:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions: