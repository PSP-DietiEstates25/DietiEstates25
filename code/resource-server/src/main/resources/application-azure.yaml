server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: resource-server
  datasource:
    # In Azure imposta direttamente SPRING_DATASOURCE_URL (consigliato), es:
    # jdbc:postgresql://<server>.postgres.database.azure.com:5432/dietiestates_resource_server?sslmode=require
    url: ${SPRING_DATASOURCE_URL:}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTHORIZATION_SERVER_ISSUER_URI:}

springdoc:
  default-produces-media-type: application/json

app:
  super-admin-email: ${SUPER_ADMIN_EMAIL:admin@admin.com}
  images-folder-path: ${IMAGES_FOLDER_PATH:/mnt/images/}
