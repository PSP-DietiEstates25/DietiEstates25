<div
  class="flex flex-col items-center justify-center px-6 sm:px-8 md:px-10"
  id="restaurantsList"
>
  @for (search of searches(); track search.id) {
    <div class="flex w-full flex-col items-center justify-center">
      <div
        class="flex w-full flex-col items-end justify-center gap-4 sm:gap-6 md:gap-8"
      >
        <!--CONTAINER LEFT-->
        <div class="flex w-full items-center gap-6 md:items-start">
          <div
            class="hidden h-32 w-48 flex-shrink-0 overflow-hidden rounded-2xl md:flex md:h-36 md:w-56"
          >
            <img
              class="h-full w-full object-cover object-center"
              alt="Restaurant image"
              [src]="getImageUrl(sear.image)"
            />
          </div>

          <div
            class="flex min-w-0 flex-1 flex-col items-start justify-start gap-6"
          >
            <div class="w-full">
              <p
                class="min-w-0 text-base font-semibold break-words whitespace-normal sm:text-lg md:text-xl"
              >
                {{ restaurant.name }}
              </p>
            </div>
            <div class="w-full">
              <p
                class="min-w-0 text-xs break-words whitespace-normal italic sm:text-base md:text-base"
              >
                "{{ restaurant.description }}"
              </p>
            </div>
            <div class="flex gap-8 self-end">
              <button
                (click)="onClick(search.id!)"
                class="cursor-pointer rounded-xs p-2 hover:bg-green-700"
                id="goTo"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke-width="1.5"
                  stroke="currentColor"
                  class="size-4 sm:size-5 md:size-6"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="m12.75 15 3-3m0 0-3-3m3 3h-7.5M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"
                  />
                </svg>
              </button>
            </div>
          </div>
        </div>
      </div>
      <hr
        class="my-2 h-0.5 w-full border-t-0 bg-black/30 sm:my-4 md:my-6 dark:bg-white/10"
      />
    </div>
  }
</div>
