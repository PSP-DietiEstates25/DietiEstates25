<form [formGroup]="form" (ngSubmit)="submitVisit()" class="grid gap-2">
  <div class="grid grid-cols-2 gap-2">
    <div>
      <label for="visit-date" class="text-sm">Data</label>
      <input
        id="visit-date"
        type="date"
        class="input_main"
        formControlName="date"
        [min]="today"
      />
    </div>
    <div>
      <label for="visit-time" class="text-sm">Orario</label>
      <input
        id="visit-time"
        type="time"
        class="input_main"
        formControlName="time"
      />
    </div>
  </div>
  <button type="submit" class="btn_primary" [disabled]="loading || !isLoggedIn">
    {{ loading ? "Invio…" : "Richiedi visita" }}
  </button>
</form>
