<form [formGroup]="form" class="grid sm:grid-cols-2 gap-4">
  <div class="sm:col-span-2">
    <label for="category" class="block text-sm mb-1 dark:text-slate-200"
      >Categoria</label
    >
    <select id="category" class="input_main" formControlName="category">
      <option value="SALE">Vendita</option>
      <option value="RENT">Affitto</option>
    </select>
  </div>

  <div class="sm:col-span-2">
    <label for="description" class="block text-sm mb-1 dark:text-slate-200"
      >Descrizione</label
    >
    <textarea
      id="description"
      class="input_main min-h-28"
      formControlName="description"
      placeholder="Descrivi l'immobile..."
    ></textarea>
    @if (form.controls.description.touched && form.controls.description.invalid)
    {
    <p class="text-sm text-red-600 mt-1">Minimo 3 caratteri</p>
    }
  </div>

  <div class="w-full col-span-2 flex justify-between gap-2 sm:px-20 mdpx_10 px-8">
    <button class="discard_button" type="button" (click)="openDiscardModal()">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="currentColor"
        class="size-6"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0"
        />
      </svg>
      <h4>Elimina</h4>
    </button>
    <button class="btn_primary" type="button" (click)="next()">Avanti</button>
  </div>
</form>

<app-discard-dialog
  [open]="isDiscardModalOpen"
  (confirm)="confirmDiscard()"
  (cancel)="closeDiscardModal()"
></app-discard-dialog>
