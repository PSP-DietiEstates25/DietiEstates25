<form [formGroup]="form" class="flex flex-col gap-6">
  <!-- Campi -->
  <div class="grid sm:grid-cols-2 gap-4">
    <!-- Categoria -->
    <div class="sm:col-span-2">
      <label
        for="category"
        class="block text-sm font-medium mb-1 text-slate-800 dark:text-slate-200"
      >
        Categoria
      </label>
      <select id="category" class="input_main" formControlName="category">
        <option value="SALE">Vendita</option>
        <option value="RENT">Affitto</option>
      </select>
    </div>

    <!-- Descrizione -->
    <div class="sm:col-span-2">
      <div class="flex items-center justify-between mb-1">
        <label
          for="description"
          class="block text-sm font-medium text-slate-800 dark:text-slate-200"
        >
          Descrizione
        </label>
        <span class="text-[11px] uppercase tracking-wide text-slate-400">
          Obbligatorio
        </span>
      </div>

      <textarea
        id="description"
        [class]="
          form.controls.description.touched && form.controls.description.invalid
            ? 'input_main min-h-28 transition ring-1 ring-red-500 border-red-500'
            : 'input_main min-h-28 transition'
        "
        formControlName="description"
        placeholder="Descrivi l'immobile, le caratteristiche principali e i punti di forza..."
      ></textarea>

      @if (form.controls.description.touched &&
      form.controls.description.invalid) {
      <p>La descrizione deve contenere almeno 3 caratteri.</p>
      } @else {
      <p class="mt-1 text-xs text-slate-500 dark:text-slate-400">
        Ad esempio: “Trilocale luminoso al terzo piano con balcone e posto
        auto”.
      </p>
      }
    </div>
  </div>

  <!-- Footer pulsanti -->
  <div
    class="w-full col-span-2 flex flex-col-reverse gap-3 border-t border-slate-200 pt-4 sm:flex-row sm:items-center sm:justify-between sm:px-20 mdpx_10 px-2 dark:border-slate-700"
  >
    <button
      class="discard_button flex items-center justify-center gap-2"
      type="button"
      (click)="openDiscardModal()"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="currentColor"
        class="size-5"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0"
        />
      </svg>
      <span>Elimina</span>
    </button>

    <button
      class="btn_primary min-w-28"
      type="button"
      (click)="next()"
      [disabled]="form.invalid"
    >
      Avanti
    </button>
  </div>
</form>

<app-discard-dialog
  [open]="isDiscardModalOpen"
  (confirm)="confirmDiscard()"
  (cancel)="closeDiscardModal()"
></app-discard-dialog>
