<section class="grid lg:grid-cols-3 gap-6">
  <form [formGroup]="utilitiesForm" class="grid gap-3 lg:col-span-1">
    <h3 class="font-semibold">Servizi</h3>
    <label class="flex items-center gap-2">
      <input type="checkbox" formControlName="hasElevator" /> Ascensore
    </label>
    <label class="flex items-center gap-2">
      <input type="checkbox" formControlName="hasDoorman" /> Portiere
    </label>
    <label class="flex items-center gap-2">
      <input type="checkbox" formControlName="hasAirConditioning" /> Aria
      condizionata
    </label>
  </form>

  <div class="grid gap-3 lg:col-span-2">
    <h3 class="font-semibold">Posizione</h3>

    <!-- Mappa interattiva -->
    <div class="relative rounded-xl overflow-hidden border h-96">
      <app-map
        (latitudeChange)="updateLatitude($event)"
        (longitudeChange)="updateLongitude($event)"
        [isEditable]="true"
      />
    </div>

    <form [formGroup]="positionForm" class="grid sm:grid-cols-2 gap-4">
      <div class="sm:col-span-2">
        <label for="address" class="block text-sm mb-1 dark:text-slate-200"
          >Indirizzo</label
        >
        <input
          id="address"
          class="input_main"
          formControlName="address"
          placeholder="Via Roma 1"
        />
      </div>
      <div>
        <label for="city" class="block text-sm mb-1 dark:text-slate-200"
          >Città</label
        >
        <input
          id="city"
          class="input_main"
          formControlName="city"
          placeholder="Napoli"
        />
      </div>
      <div>
        <label for="municipality" class="block text-sm mb-1 dark:text-slate-200"
          >Comune</label
        >
        <input
          id="municipality"
          class="input_main"
          formControlName="municipality"
          placeholder="NA"
        />
      </div>
      <div>
        <label for="radius" class="block text-sm mb-1 dark:text-slate-200"
          >Raggio (m)</label
        >
        <input
          id="radius"
          type="number"
          class="input_main"
          formControlName="radius"
          placeholder="0"
        />
      </div>
      <div class="flex justify-start items-start gap-5">
        @if(this.submitted && this.latitude?.invalid){
          @if(this.latitude?.hasError('required')){
            <h3 class="form_error">Latitude is required</h3>
          }
        }
        @if(this.submitted && this.longitude?.invalid){
          @if(this.longitude?.hasError('required')){
            <h3 class="form_error">Longitude is required</h3>
          }
        }
        </div>
    </form>

    <div class="flex justify-end gap-2 mt-2">
      <button class="btn_primary" type="button" (click)="next()">Avanti</button>
      <button class="btn_primary" type="button" (click)="previous()">Indietro</button>
    </div>
  </div>
</section>
