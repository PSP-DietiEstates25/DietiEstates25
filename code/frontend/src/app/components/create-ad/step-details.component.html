<form [formGroup]="form" class="grid sm:grid-cols-2 gap-4">
  
  <div>
    <label for="type" class="block text-sm mb-1 dark:text-slate-200"
      >Tipologia</label
    >
    <select id="type" class="input_main" formControlName="type">
      <option>Appartamento</option>
      <option>Casa indipendente</option>
      <option>Stanza</option>
      <option>Attico</option>
    </select>
  </div>
  <div>
    <label for="size" class="block text-sm mb-1 dark:text-slate-200">Mq</label>
    <input id="size" type="number" class="input_main" formControlName="size" />
  </div>
  <div class="sm:col-span-2">
    <label for="description" class="block text-sm mb-1 dark:text-slate-200"
      >Descrizione</label
    >
    <textarea
      id="description"
      rows="4"
      class="input_main"
      formControlName="description"
      placeholder="Dettagli dell'immobile"
    ></textarea>
  </div>

 <div class="sm:col-span-2 h-100 relative">
    <label for="map" class="label_style">Posizione immobile</label>

    <app-map
      [isEditable]="false"
      [initialLatitude]="form.get('latitude')?.value || 40.85631"
      [initialLongitude]="form.get('longitude')?.value || 14.24641"
      (latitudeChange)="updateLatitude($event)"
      (longitudeChange)="updateLongitude($event)"
    ></app-map>
  </div>



  <div class="sm:col-span-2 flex justify-between gap-2 mt-2">
    <button type="button" class="btn_ghost" (click)="back()">Indietro</button>
    <button type="button" class="btn_primary" (click)="next()">Avanti</button>
  </div>
</form>
