<section class="grid gap-4">
  <p class="text-sm opacity-80">
    Controlla i dati inseriti negli step precedenti.
  </p>

  @if (facade.error()) {
  <div class="p-3 rounded bg-red-50 text-red-700 border border-red-200">
    {{ facade.error() }}
  </div>
  }

  <div class="flex justify-end gap-2">
    <button
      class="btn_primary"
      type="button"
      [disabled]="!canPublish() || facade.loading()"
      (click)="publish()"
    >
      @if (facade.loading()) { Pubblicazione… } @else { Pubblica annuncio }
    </button>
  </div>
</section>
