<section class="grid gap-4">
  <p class="text-sm opacity-80">
    Controlla i dati inseriti negli step precedenti.
  </p>

  @if (facade.error()) {
  <div class="p-3 rounded bg-red-50 text-red-700 border border-red-200">
    {{ facade.error() }}
  </div>
  }

  <div class="w-full col-span-3 flex justify-between gap-2 sm:px-20 mdpx_10 px-8">
    <button class="btn_primary" type="button" (click)="previous()">Indietro</button>
    <!--Sotto nel discard button dovrebbe essere discard() al posto di cancel()-->
    <button class="discard_button" type="button" (click)="cancel()">Elimina</button>
    <button
      class="publish_button"
      type="button"
      [disabled]="!canPublish() || facade.loading()"
      (click)="publish()"
    >
      @if (facade.loading()) { Pubblicazione… } @else { Pubblica annuncio }
    </button>
  </div>
</section>
