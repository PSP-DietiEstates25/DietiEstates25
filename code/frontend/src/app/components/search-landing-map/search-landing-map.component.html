<div class="relative h-[calc(100vh-64px)] w-full">
  <div
    class="absolute top-5 left-5 z-[1000] w-full max-w-sm rounded-xl border border-blue-100 bg-white/90 p-4 shadow-xl backdrop-blur"
  >
    <h1 class="text-xl font-bold text-blue-900">{{ cityName }}</h1>
    <p class="mb-2 text-xs tracking-wide text-gray-500 uppercase">
      {{ regionName }}
    </p>

    <div class="mb-2 flex items-center gap-2">
      @if (loading) {
        <p class="text-sm font-medium text-gray-700">{{ infoMessage }}</p>
      }
    </div>

    <div class="flex flex-col items-start justify-center gap-2">
      @for (
        municipality of municipalitiesSelection;
        track municipality.name;
        let i = $index
      ) {
        <div
          class="group flex cursor-pointer items-center space-x-3 rounded-md p-2 transition-colors hover:bg-slate-50"
        >
          <input
            [id]="'municipality_radio_' + i"
            type="radio"
            name="municipality_group"
            [value]="municipality.name"
            [checked]="municipality.isSelected"
            (change)="onMunicipalityChange(municipality.name)"
            class="peer relative h-5 w-5 cursor-pointer appearance-none rounded-full border-2 border-slate-300 bg-white transition-all duration-200 checked:border-[6px] checked:border-blue-600 checked:bg-white hover:border-blue-400 focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 focus:outline-none"
          />

          <label
            [for]="'municipality_radio_' + i"
            class="cursor-pointer font-medium text-slate-600 transition-colors select-none group-hover:text-blue-600 peer-checked:font-bold peer-checked:text-blue-700"
          >
            {{ municipality.name }}
          </label>
        </div>
      }
    </div>

    <button type="submit" class="publish_button">Cerca</button>
  </div>

  <div #mapContainer class="z-0 h-full w-full bg-slate-100"></div>
</div>
