@if (open()) {
  <div
    class="fixed top-0 left-0 right-0 bottom-0 z-50 flex items-center justify-center bg-gray-900 bg-opacity-50"
    (click)="onBackdropClick($event)"
  >
    <div
      class="relative w-full max-w-xl md:max-w-2xl bg-white rounded-lg shadow dark:bg-gray-700 max-h-[90vh] overflow-y-auto mx-4 md:mx-0"
      (click)="$event.stopPropagation()"
    >
      <!-- Header -->
      <div class="sticky top-0 flex items-center justify-between p-4 bg-white dark:bg-gray-700 dark:border-gray-600">
        <div class="w-full flex flex-col justify-end gap-0">
          <button
            type="button"
            (click)="onCancel()"
            class="self-end text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm w-8 h-8 flex items-center justify-center dark:hover:bg-gray-600 dark:hover:text-white"
          >
            <svg class="size-4" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
              <path
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"
              />
            </svg>
            <span class="sr-only">Chiudi</span>
          </button>
          <h3 class="text-xl font-semibold text-gray-900 dark:text-white">
            Vuoi davvero procedere con l'eliminazione?
          </h3>
        </div>
      </div>

      <!-- Body -->
      <div class="p-4 space-y-2">
        <p class="text-sm text-gray-700 dark:text-gray-200">
          Se esci ora, le informazioni inserite per questo annuncio andranno perse.
        </p>
      </div>

      <!-- Footer -->
      <div class="flex justify-end gap-2 p-4 border-t border-gray-200 dark:border-gray-600">
        <button
          type="button"
          class="px-4 py-2 rounded-md border border-gray-300 text-sm hover:bg-gray-100"
          (click)="onCancel()"
        >
          Annulla
        </button>
        <button
          type="button"
          class="px-4 py-2 rounded-md bg-red-600 text-white text-sm hover:bg-red-700"
          (click)="onConfirm()"
        >
          Elimina comunque
        </button>
      </div>
    </div>
  </div>
}
