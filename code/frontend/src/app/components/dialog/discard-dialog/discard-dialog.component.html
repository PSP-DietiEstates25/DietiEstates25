@if (open()) {
<div
  class="fixed inset-0 z-[9999] flex items-center justify-center bg-black/40 backdrop-blur-sm px-4"
  (click)="onBackdropClick($event)"
>
  <div
    class="relative w-full max-w-md md:max-w-lg rounded-2xl bg-white shadow-xl ring-1 ring-black/5 dark:bg-slate-900 dark:ring-white/10 overflow-hidden transform transition-all"
    (click)="$event.stopPropagation()"
    role="dialog"
    aria-modal="true"
    aria-labelledby="discard-title"
    aria-describedby="discard-description"
  >
    <!-- Header -->
    <div class="flex items-start gap-3 px-5 pt-4 pb-2">
      <!-- Icona warning -->
      <div
        class="mt-1 flex h-9 w-9 items-center justify-center rounded-full bg-red-50 text-red-600 dark:bg-red-900/30 dark:text-red-300"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-5 w-5"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M12 9v4m0 4h.01M10.29 3.86 2.82 18a1.5 1.5 0 0 0 1.32 2.2h15.72a1.5 1.5 0 0 0 1.32-2.2L13.71 3.86a1.5 1.5 0 0 0-2.42 0z"
          />
        </svg>
      </div>

      <div class="flex-1">
        <h3
          id="discard-title"
          class="text-base font-semibold text-slate-900 dark:text-slate-50"
        >
          Vuoi davvero uscire dalla creazione dell’annuncio?
        </h3>
        <p
          id="discard-description"
          class="mt-1 text-sm text-slate-600 dark:text-slate-300"
        >
          Se esci ora, le informazioni inserite finora per questo annuncio
          andranno perse e dovrai reinserirle da capo.
        </p>
      </div>

      <!-- Pulsante chiudi -->
      <button
        type="button"
        (click)="onCancel()"
        class="ml-2 inline-flex h-8 w-8 items-center justify-center rounded-full text-slate-400 hover:bg-slate-100 hover:text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 dark:hover:bg-slate-800 dark:hover:text-slate-100"
      >
        <span class="sr-only">Chiudi</span>
        <svg
          class="h-4 w-4"
          aria-hidden="true"
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 14 14"
        >
          <path
            stroke="currentColor"
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"
          />
        </svg>
      </button>
    </div>

    <!-- Body (nota / spiegazione aggiuntiva, se vuoi) -->
    <div class="px-5 pb-3">
      <p class="text-xs text-slate-500 dark:text-slate-400">
        Puoi sempre continuare la compilazione e pubblicare l’annuncio in un
        secondo momento.
      </p>
    </div>

    <!-- Footer -->
    <div
      class="flex flex-col gap-2 border-t border-slate-200 px-5 py-3 sm:flex-row sm:justify-end dark:border-slate-700"
    >
      <button
        type="button"
        class="inline-flex justify-center rounded-md border border-slate-300 bg-white px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-indigo-500 dark:border-slate-600 dark:bg-slate-900 dark:text-slate-100 dark:hover:bg-slate-800"
        (click)="onCancel()"
      >
        Annulla
      </button>
      <button
        type="button"
        class="inline-flex justify-center rounded-md bg-red-600 px-4 py-2 text-sm font-medium text-white shadow-sm hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-red-500"
        (click)="onConfirm()"
      >
        Elimina comunque
      </button>
    </div>
  </div>
</div>
}
