<h2 class="font-semibold mb-2">Fai un'offerta</h2>
<form [formGroup]="form" (ngSubmit)="submitOffer()" class="grid gap-2">
  <label for="offer-amount" class="text-sm">Importo (€)</label>
  <input
    id="offer-amount"
    type="number"
    class="input_main"
    formControlName="amount"
    placeholder="Es. 250000"
  />
  <button type="submit" class="btn_primary" [disabled]="loading">
    {{ loading ? "Invio…" : "Invia offerta" }}
  </button>
</form>
@if (form.touched && form.invalid) {
<p class="text-sm text-red-600 mt-1">Inserisci un importo valido.</p>
} @if (!isLoggedIn) {
<p class="text-xs mt-2">Per inviare un'offerta devi accedere.</p>
} @if (ok) {
<p class="text-green-600 mt-2">{{ ok }}</p>
} @if (err) {
<p class="text-red-600 mt-2">{{ err }}</p>
}
