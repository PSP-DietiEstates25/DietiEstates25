<app-navbar></app-navbar>
<section
  class="relative overflow-hidden bg-gradient-to-b from-slate-50 to-white dark:from-slate-950 dark:to-slate-900"
>
  <!-- Hero -->
  <div class="container mx-auto px-4 py-16 sm:py-20 md:py-24">
    <div class="grid md:grid-cols-2 items-center gap-8">
      <div>
        <h1
          class="text-3xl sm:text-4xl md:text-5xl font-extrabold leading-tight text-slate-900 dark:text-white"
        >
          Trova la tua prossima
          <span class="text-amber-600 dark:text-blue-400">casa</span> in pochi
          secondi
        </h1>
        <p class="mt-4 text-slate-600 dark:text-slate-300 text-base sm:text-lg">
          Cerca per città, indirizzo. Filtri avanzati disponibili nella pagina
          risultati.
        </p>
        <div class="mt-6">
          <app-search-bar></app-search-bar>
        </div>

        <div class="mt-4 flex flex-wrap gap-3 text-sm">
          <a
            routerLink="/search"
            [queryParams]="{ q: 'Napoli' }"
            class="link_style"
            >Napoli</a
          >
          <a
            routerLink="/search"
            [queryParams]="{ q: 'Milano' }"
            class="link_style"
            >Milano</a
          >
          <a
            routerLink="/search"
            [queryParams]="{ q: 'Roma' }"
            class="link_style"
            >Roma</a
          >
        </div>
      </div>

      <!-- Illustrazione placeholder -->
      <div class="hidden md:block">
        <img
          src="/assets/hero-houses.jpg"
          alt="case"
          class="w-full max-w-md mx-auto"
        />
      </div>
    </div>
  </div>

  <!-- fascia info -->
  <div
    class="border-t border-amber-600/30 dark:border-blue-500/30 bg-slate-100/60 dark:bg-slate-900/50 backdrop-blur"
  >
    <div
      class="container mx-auto px-4 py-6 grid sm:grid-cols-3 gap-4 text-sm text-slate-700 dark:text-slate-300"
    >
      <div>
        <span class="font-semibold">Aggiornato</span>: annunci verificati
      </div>
      <div>
        <span class="font-semibold">Filtri</span>: prezzo, stanze, tipologia...
      </div>
      <div>
        <span class="font-semibold">Mappa</span>: esplora le zone più richieste
      </div>
    </div>
  </div>
</section>
