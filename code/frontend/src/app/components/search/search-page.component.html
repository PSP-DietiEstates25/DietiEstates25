<app-navbar></app-navbar>
<section class="container mx-auto px-4 py-6">
  <app-search-bar></app-search-bar>
  <!-- Filtri avanzati (collassabili) -->
  <details
    class="rounded-2xl border dark:border-slate-700 bg-white/70 dark:bg-slate-900/70 backdrop-blur p-4"
  >
    <summary class="cursor-pointer select-none font-semibold">
      Filtri avanzati
    </summary>

    <div class="mt-4 grid md:grid-cols-3 sm:grid-cols-2 gap-4">
      <div>
        <label class="block text-sm mb-1 dark:text-slate-200"
          >Prezzo min (€)</label
        >
        <input
          type="number"
          [(ngModel)]="priceMin"
          class="input_main"
          placeholder="0"
        />
      </div>
      <div>
        <label class="block text-sm mb-1 dark:text-slate-200"
          >Prezzo max (€)</label
        >
        <input
          type="number"
          [(ngModel)]="priceMax"
          class="input_main"
          placeholder="500000"
        />
      </div>
      <div>
        <label class="block text-sm mb-1 dark:text-slate-200">Stanze</label>
        <input
          type="number"
          min="1"
          [(ngModel)]="rooms"
          class="input_main"
          placeholder="3"
        />
      </div>
      <div>
        <label class="block text-sm mb-1 dark:text-slate-200">Tipologia</label>
        <select class="input_main" [(ngModel)]="type">
          <option value="">Qualsiasi</option>
          <option>Appartamento</option>
          <option>Casa indipendente</option>
        </select>
      </div>
      <div>
        <label class="block text-sm mb-1 dark:text-slate-200">Mq min</label>
        <input
          type="number"
          min="0"
          [(ngModel)]="sizeMin"
          class="input_main"
          placeholder="50"
        />
      </div>
      <div>
        <label class="block text-sm mb-1 dark:text-slate-200">Mq max</label>
        <input
          type="number"
          min="0"
          [(ngModel)]="sizeMax"
          class="input_main"
          placeholder="120"
        />
      </div>
    </div>

    <div class="mt-4 flex flex-wrap items-center gap-4">
      <div class="ml-auto">
        <label class="block text-sm mb-1 dark:text-slate-200">Ordina per</label>
        <select class="input_main" [(ngModel)]="orderBy">
          <option value="recent">Più recenti</option>
          <option value="price_asc">Prezzo ↑</option>
          <option value="price_desc">Prezzo ↓</option>
        </select>
      </div>
    </div>

    <div class="mt-4 flex gap-2">
      <button type="button" class="btn_primary" (click)="apply()">
        Applica filtri
      </button>
      <button type="button" class="btn_ghost" (click)="clear()">Pulisci</button>
    </div>
  </details>

  <!-- Riepilogo e risultati -->
  <div class="mt-4">
    <h2 class="text-xl font-bold text-slate-900 dark:text-white mb-2">
      {{ title() }}
    </h2>
    <p class="text-sm text-slate-600 dark:text-slate-300 mb-6">
      {{ results().length }} risultati
    </p>
  </div>

  @if (loading()) {
  <div class="py-12 text-center">Caricamento…</div>
  } @else {
  <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
    @for (ad of results(); track ad.id) {
    <article class="rounded-2xl border dark:border-slate-700 overflow-hidden">
      <img
        [src]="ad.coverUrl || '/assets/placeholder-house.jpg'"
        alt="cover"
        class="w-full aspect-video object-cover"
      />
      <div class="p-4">
        <h3 class="font-semibold text-slate-900 dark:text-white line-clamp-2">
          {{ ad.title }}
        </h3>
        <div
          class="mt-2 text-sm text-slate-600 dark:text-slate-300 flex justify-between"
        >
          <span>{{ ad.city || "—" }}</span>
          @if (ad.price != null) {
          <span>€ {{ ad.price | number : "1.0-0" }}</span> }
        </div>
      </div>
    </article>
    } @empty {
    <div class="py-12 text-center text-slate-600 dark:text-slate-300">
      Nessun risultato. Modifica i filtri.
    </div>
    }
  </div>
  }
</section>
