<app-navbar></app-navbar>

<main class="mx-auto max-w-7xl space-y-4 p-4 md:p-6">
  <header class="flex items-end justify-between gap-3">
    <div>
      <h1 class="text-2xl font-bold text-slate-900 dark:text-white">Offers</h1>
      <p class="text-sm text-slate-600 dark:text-slate-400">
        Immobili su cui hai pubblicato almeno un’offerta.
      </p>
    </div>
  </header>

  @if (this.facade.loading()) {
    <div class="py-12 text-center text-sm text-slate-600 dark:text-slate-300">
      Caricamento offerte...
    </div>
  } @else if (offers.length === 0) {
    <div class="col-span-full py-12 text-center text-slate-600 dark:text-slate-300">
      <p class="text-sm">Non hai presentato ancora offerte.</p>
      <p class="mt-1 text-xs text-slate-500 dark:text-slate-400">
        Proponi una nuova offerta sulla pagina di un annuncio per visualizzarla qui.
      </p>
    </div>
  } @else {
    <app-offers-list></app-offers-list>
    <app-offers-paginator></app-offers-paginator>
  }
</main>
