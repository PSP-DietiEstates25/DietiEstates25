<section class="container mx-auto px-4 py-8 max-w-lg">
  <h1 class="text-2xl font-bold text-slate-900 dark:text-white mb-6">Accedi</h1>

  @if (errorMsg()) {
  <div class="mb-4 text-red-600">{{ errorMsg() }}</div>
  }

  <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">
    <div>
      <label class="block text-sm mb-1 dark:text-slate-200">Email</label>
      <input
        type="email"
        formControlName="email"
        class="input_main"
        placeholder="you@example.com"
      />
      @if (form.controls.email.touched && form.controls.email.invalid) {
      <p class="text-sm text-red-600 mt-1">Inserisci una email valida</p>
      }
    </div>

    <div>
      <label class="block text-sm mb-1 dark:text-slate-200">Password</label>
      <input
        type="password"
        formControlName="password"
        class="input_main"
        placeholder="••••••••"
      />
      @if (form.controls.password.touched && form.controls.password.invalid) {
      <p class="text-sm text-red-600 mt-1">Minimo 6 caratteri</p>
      }
    </div>

    <button class="btn_primary w-full" [disabled]="loading()">
      @if (loading()) { Attendere… } @else { Accedi }
    </button>
  </form>

  <p class="mt-4 text-sm dark:text-slate-300">
    Non hai un account?
    <a class="link_style" routerLink="/auth/register">Registrati</a>
  </p>

  <div class="flex flex-col justify-center items-center p-4">

    <div>
      <a href="https://accounts.google.com/o/oauth2/v2/auth?redirect_uri={redirect_uri}&response_type=code&client_id={client_id}&scope=https%3A%2F%2Fwww.googleapis.com%2Fauth%2Fuserinfo.email+https%3A%2F%2Fwww.googleapis.com%2Fauth%2Fuserinfo.profile+openid&access_type=offline">
        Sign in with Google
      </a>
      <button class="" (click)="signInWithGoogle()">
        <img src="https://cdn1.iconfinder.com/data/icons/google-s-logo/150/Google_Icons-09-512.png" alt="Google" class="google-icon" />
        Google
      </button>
    </div>

    <div>
      <button class="" (click)="signInWithGithub()">
        <img src="https://cdn1.iconfinder.com/data/icons/google-s-logo/150/Google_Icons-09-512.png" alt="Github" class="github-icon" />
        Github
      </button>
    </div>

    <div>
      <button class="" (click)="signInWithFacebook()">
        <img src="https://cdn1.iconfinder.com/data/icons/google-s-logo/150/Google_Icons-09-512.png" alt="Facebook" class="facebook-icon" />
        Facebook
      </button>
    </div>

  </div>
</section>
