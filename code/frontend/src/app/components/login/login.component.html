<section class="container mx-auto px-4 py-8 max-w-lg">
  <h1 class="text-2xl font-bold text-slate-900 dark:text-white mb-6">Accedi</h1>

  @if (errorMsg()) {
  <div class="mb-4 text-red-600">{{ errorMsg() }}</div>
  }

  <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">
    <div>
      <label class="block text-sm mb-1 dark:text-slate-200">Email</label>
      <input
        type="email"
        formControlName="email"
        class="input_main"
        placeholder="you@example.com"
      />
      @if (form.controls.email.touched && form.controls.email.invalid) {
      <p class="text-sm text-red-600 mt-1">Inserisci una email valida</p>
      }
    </div>

    <div>
      <label class="block text-sm mb-1 dark:text-slate-200">Password</label>
      <input
        type="password"
        formControlName="password"
        class="input_main"
        placeholder="••••••••"
      />
      @if (form.controls.password.touched && form.controls.password.invalid) {
      <p class="text-sm text-red-600 mt-1">Minimo 6 caratteri</p>
      }
    </div>

    <button class="btn_primary w-full" [disabled]="loading()">
      @if (loading()) { Attendere… } @else { Accedi }
    </button>
  </form>

  <p class="mt-4 text-sm dark:text-slate-300">
    Non hai un account?
    <a class="link_style" routerLink="/auth/register">Registrati</a>
  </p>
</section>
