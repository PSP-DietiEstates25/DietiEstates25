<section
  class="rounded-2xl border border-blue-300 bg-white/10 p-4 shadow-sm md:p-5 dark:border-blue-900 dark:bg-blue-950/10"
>
  <form [formGroup]="mainForm" (ngSubmit)="apply()">
    <header class="mb-4 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-2">
        <button
          type="button"
          class="inline-flex h-7 w-7 items-center justify-center rounded-full border border-blue-200 bg-white/80 text-xs hover:bg-blue-50 dark:border-blue-900 dark:bg-blue-900/10"
          (click)="toggleOpen()"
          aria-label="Mostra o nascondi i filtri"
        >
          <span
            class="inline-block transition-transform"
            [class.rotate-90]="isOpen()"
          >
            ▶
          </span>
        </button>

        <div>
          <h2 class="text-lg font-semibold text-blue-900 dark:text-blue-100">
            Filtri
          </h2>
          <p class="text-xs text-blue-600 dark:text-blue-300">
            Affina la ricerca per zona, caratteristiche e fascia di prezzo
          </p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button
          class="rounded-xl border border-transparent px-3 py-1.5 text-xs font-medium text-blue-900 hover:border-blue-200 hover:bg-blue-50 dark:text-blue-200 dark:hover:bg-blue-900/10"
          type="button"
          (click)="clearForms()"
        >
          Reset filtri
        </button>

        <button
          class="rounded-xl bg-blue-600 px-3 py-1.5 text-sm text-white hover:bg-blue-900 disabled:opacity-50"
          type="submit"
          [disabled]="facade.loading()"
        >
          Applica
        </button>
      </div>
    </header>

    @if (isOpen()) {
      <div class="space-y-4">
        @if (facade.error()) {
          <p
            class="mb-3 rounded-xl bg-red-50 px-3 py-2 text-sm text-red-900 dark:bg-red-900/30 dark:text-red-200"
          >
            {{ facade.error() }}
          </p>
        }
        @if (facade.loading()) {
          <p
            class="mb-3 flex items-center gap-2 rounded-xl bg-blue-50 px-3 py-2 text-xs text-blue-900 dark:bg-blue-900/10 dark:text-blue-100"
          >
            <span
              class="inline-block size-2 animate-pulse rounded-full bg-blue-500"
            ></span>
            Caricamento dei risultati…
          </p>
        }

        <div class="grid grid-cols-1 gap-4 lg:grid-cols-3">
          <div
            [formGroup]="geographicalPositionForm"
            class="rounded-xl border border-blue-200 bg-white/90 p-3 dark:border-blue-900/10 dark:bg-blue-900/10"
          >
            <h3 class="mb-1 font-medium text-blue-900 dark:text-blue-100">
              Posizione
            </h3>

            <div class="grid grid-cols-1 gap-3 text-xs">
              <label class="dark:text-gray-200">
                Regione
                <select
                  formControlName="region"
                  class="mt-1 w-full rounded-lg border border-blue-200 bg-white px-2 py-2 dark:border-slate-600 dark:bg-slate-700 dark:text-white dark:placeholder-gray-400 dark:hover:bg-slate-600"
                  style="color-scheme: light dark"
                >
                  <option value="" class="text-gray-500 dark:text-gray-400">
                    -- Seleziona Regione --
                  </option>
                  @for (reg of regions(); track reg) {
                    <option [value]="reg">{{ reg }}</option>
                  }
                </select>
              </label>

              <label class="dark:text-gray-200">
                Città
                <select
                  formControlName="city"
                  class="mt-1 w-full rounded-lg border border-blue-200 bg-white px-2 py-2 disabled:opacity-50 dark:border-slate-600 dark:bg-slate-700 dark:text-white dark:hover:bg-slate-600"
                  style="color-scheme: light dark"
                >
                  <option value="" class="text-gray-500 dark:text-gray-400">
                    -- Seleziona Città --
                  </option>
                  @for (city of cities(); track city) {
                    <option [value]="city">{{ city }}</option>
                  }
                </select>
              </label>
            </div>
          </div>

          <div
            class="rounded-xl border border-blue-200 bg-white/90 p-3 dark:border-blue-900/10 dark:bg-blue-900/10"
          >
            <h3 class="mb-2 font-medium text-blue-900 dark:text-blue-100">
              Utilità
            </h3>

            <div
              formGroupName="utilityForm"
              class="grid grid-cols-1 gap-2 text-xs text-blue-950 dark:text-blue-100"
            >
              <label
                class="flex items-center gap-2 rounded-full border border-blue-100 bg-blue-50/60 px-3 py-1.5 dark:border-slate-600 dark:bg-slate-700 dark:hover:bg-slate-600"
              >
                <input
                  type="checkbox"
                  class="size-3 accent-blue-600"
                  formControlName="hasElevator"
                />
                Ascensore
              </label>

              <label
                class="flex items-center gap-2 rounded-full border border-blue-100 bg-blue-50/60 px-3 py-1.5 dark:border-slate-600 dark:bg-slate-700 dark:hover:bg-slate-600"
              >
                <input
                  type="checkbox"
                  class="size-3 accent-blue-600"
                  formControlName="hasDoorman"
                />
                Portineria
              </label>

              <label
                class="flex items-center gap-2 rounded-full border border-blue-100 bg-blue-50/60 px-3 py-1.5 dark:border-slate-600 dark:bg-slate-700 dark:hover:bg-slate-600"
              >
                <input
                  type="checkbox"
                  class="size-3 accent-blue-600"
                  formControlName="hasAirConditioning"
                />
                Aria condizionata
              </label>

              <label
                class="flex items-center gap-2 rounded-full border border-blue-100 bg-blue-50/60 px-3 py-1.5 dark:border-slate-600 dark:bg-slate-700 dark:hover:bg-slate-600"
              >
                <input
                  type="checkbox"
                  class="size-3 accent-blue-600"
                  formControlName="nearSchool"
                />
                Vicino a scuole
              </label>

              <label
                class="flex items-center gap-2 rounded-full border border-blue-100 bg-blue-50/60 px-3 py-1.5 dark:border-slate-600 dark:bg-slate-700 dark:hover:bg-slate-600"
              >
                <input
                  type="checkbox"
                  class="size-3 accent-blue-600"
                  formControlName="nearPark"
                />
                Vicino a parchi
              </label>

              <label
                class="flex items-center gap-2 rounded-full border border-blue-100 bg-blue-50/60 px-3 py-1.5 dark:border-slate-600 dark:bg-slate-700 dark:hover:bg-slate-600"
              >
                <input
                  type="checkbox"
                  class="size-3 accent-blue-600"
                  formControlName="nearPublicTransport"
                />
                Vicino a trasporto pubblico
              </label>
            </div>
          </div>

          <div
            class="rounded-xl border border-blue-200 bg-white/90 p-3 dark:border-blue-900/10 dark:bg-blue-900/10"
          >
            <h3 class="mb-2 font-medium text-blue-900 dark:text-blue-100">
              Filtri catastali
            </h3>

            <div
              formGroupName="cadastralFilterForm"
              class="grid grid-cols-2 gap-2 text-xs text-blue-950 dark:text-blue-100"
            >
              <label
                >Prezzo minimo
                <input
                  type="number"
                  min="1"
                  class="mt-1 w-full rounded-lg border border-blue-200 px-2 py-1.5 focus:ring-1 focus:ring-slate-400 focus:outline-none dark:border-slate-600 dark:bg-slate-700 dark:text-blue-100 dark:hover:bg-slate-600"
                  formControlName="minPrice"
                />
              </label>
              <label
                >Prezzo massimo
                <input
                  type="number"
                  min="1"
                  class="mt-1 w-full rounded-lg border border-blue-200 px-2 py-1.5 focus:ring-1 focus:ring-slate-400 focus:outline-none dark:border-slate-600 dark:bg-slate-700 dark:text-blue-100 dark:hover:bg-slate-600"
                  formControlName="maxPrice"
                />
              </label>

              <label
                >Mq minimi
                <input
                  type="number"
                  min="1"
                  class="mt-1 w-full rounded-lg border border-blue-200 px-2 py-1.5 focus:ring-1 focus:ring-slate-400 focus:outline-none dark:border-slate-600 dark:bg-slate-700 dark:text-blue-100 dark:hover:bg-slate-600"
                  formControlName="minSquareMeters"
                />
              </label>
              <label
                >Mq massimi
                <input
                  type="number"
                  min="1"
                  class="mt-1 w-full rounded-lg border border-blue-200 px-2 py-1.5 focus:ring-1 focus:ring-slate-400 focus:outline-none dark:border-slate-600 dark:bg-slate-700 dark:text-blue-100 dark:hover:bg-slate-600"
                  formControlName="maxSquareMeters"
                />
              </label>

              <label
                >Classe Energetica min
                <select
                  class="mt-1 w-full rounded-lg border border-blue-200 px-2 py-1.5 focus:ring-1 focus:ring-slate-400 focus:outline-none dark:border-slate-600 dark:bg-slate-700 dark:text-blue-100 dark:hover:bg-slate-600"
                  formControlName="minEnergyClass"
                >
                  <option [ngValue]="1">A4</option>
                  <option [ngValue]="2">A3</option>
                  <option [ngValue]="3">A2</option>
                  <option [ngValue]="4">A1</option>
                  <option [ngValue]="5">B</option>
                  <option [ngValue]="6">C</option>
                  <option [ngValue]="7">D</option>
                  <option [ngValue]="8">E</option>
                  <option [ngValue]="9">F</option>
                  <option [ngValue]="10">G</option>
                </select>
              </label>

              <label
                >Classe Energetica max
                <select
                  class="mt-1 w-full rounded-lg border border-blue-200 px-2 py-1.5 focus:ring-1 focus:ring-slate-400 focus:outline-none dark:border-slate-600 dark:bg-slate-700 dark:text-blue-100 dark:hover:bg-slate-600"
                  formControlName="maxEnergyClass"
                >
                  <option [ngValue]="1">A4</option>
                  <option [ngValue]="2">A3</option>
                  <option [ngValue]="3">A2</option>
                  <option [ngValue]="4">A1</option>
                  <option [ngValue]="5">B</option>
                  <option [ngValue]="6">C</option>
                  <option [ngValue]="7">D</option>
                  <option [ngValue]="8">E</option>
                  <option [ngValue]="9">F</option>
                  <option [ngValue]="10">G</option>
                </select>
              </label>

              <label
                >Stanze minime
                <input
                  type="number"
                  min="1"
                  class="mt-1 w-full rounded-lg border border-blue-200 px-2 py-1.5 focus:ring-1 focus:ring-slate-400 focus:outline-none dark:border-slate-600 dark:bg-slate-700 dark:text-blue-100 dark:hover:bg-slate-600"
                  formControlName="minRooms"
                />
              </label>
              <label
                >Stanze massime
                <input
                  type="number"
                  min="1"
                  class="mt-1 w-full rounded-lg border border-blue-200 px-2 py-1.5 focus:ring-1 focus:ring-slate-400 focus:outline-none dark:border-slate-600 dark:bg-slate-700 dark:text-blue-100 dark:hover:bg-slate-600"
                  formControlName="maxRooms"
                />
              </label>

              <label
                >Piano minimo
                <input
                  type="number"
                  min="1"
                  class="mt-1 w-full rounded-lg border border-blue-200 px-2 py-1.5 focus:ring-1 focus:ring-slate-400 focus:outline-none dark:border-slate-600 dark:bg-slate-700 dark:text-blue-100 dark:hover:bg-slate-600"
                  formControlName="minFloor"
                />
              </label>
              <label
                >Piano massimo
                <input
                  type="number"
                  min="1"
                  class="mt-1 w-full rounded-lg border border-blue-200 px-2 py-1.5 focus:ring-1 focus:ring-slate-400 focus:outline-none dark:border-slate-600 dark:bg-slate-700 dark:text-blue-100 dark:hover:bg-slate-600"
                  formControlName="maxFloor"
                />
              </label>
            </div>
          </div>
        </div>

        <footer class="mt-4 flex flex-wrap items-center justify-between gap-3">
          <span class="text-xs font-medium text-blue-900 dark:text-blue-200">
            Tipo di annuncio
          </span>

          <select
            class="rounded-lg border border-blue-200 bg-white/90 px-3 py-1.5 text-xs text-blue-950 focus:border-blue-400 focus:ring-1 focus:ring-slate-400 focus:outline-none dark:border-slate-600 dark:bg-slate-700 dark:text-blue-100 dark:hover:bg-slate-600"
            formControlName="category"
          >
            <option value="SALE">Vendita</option>
            <option value="RENT">Affitto</option>
          </select>
        </footer>
      </div>
    }
  </form>
</section>
