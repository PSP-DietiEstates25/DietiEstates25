<section
  class="rounded-2xl border bg-blue-800 border-blue-800 p-4 md:p-5 shadow-sm dark:bg-blue-900/10 dark:border-blue-700"
>
  <header class="mb-4 flex items-center justify-between">
    <h2 class="text-lg font-semibold text-blue-900 dark:text-blue-100">
      Filtri
    </h2>
    <div class="flex items-center gap-2">
      <button
        class="rounded-xl px-3 py-1.5 text-sm text-white bg-blue-600 hover:bg-blue-700 disabled:opacity-50"
        type="button"
        [disabled]="facade.loading()"
        (click)="apply()"
      >
        Applica
      </button>
    </div>
  </header>

  @if (facade.error()) {
  <p
    class="mb-3 rounded-xl bg-red-50 text-red-700 px-3 py-2 text-sm dark:bg-red-900/30 dark:text-red-200"
  >
    {{ facade.error() }}
  </p>
  } @if (facade.loading()) {
  <p
    class="mb-3 rounded-xl bg-blue-100 text-blue-900 px-3 py-2 text-sm dark:bg-blue-800/50 dark:text-blue-100"
  >
    Caricamento…
  </p>
  }

  <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
    <!-- POSIZIONE -->
    <div
      class="rounded-xl border border-blue-500 bg-white/90 p-3 dark:bg-blue-900/20 dark:border-blue-700"
    >
      <h3 class="mb-2 font-medium text-blue-900 dark:text-blue-100">
        Posizione
      </h3>
      <div class="grid grid-cols-2 gap-2 text-sm">
        <label class="text-xs text-blue-950 dark:text-blue-100"
          >Città
          <input
            class="mt-1 w-full rounded-lg border border-blue-200 px-2 py-1.5 focus:outline-none focus:ring-2 focus:ring-blue-400 dark:border-blue-700 dark:bg-blue-900/30 dark:text-blue-100"
            [ngModel]="geo().city"
            (ngModelChange)="setGeo('city', $event)"
          />
        </label>
        <label class="text-xs text-blue-950 dark:text-blue-100"
          >Comune
          <input
            class="mt-1 w-full rounded-lg border border-blue-200 px-2 py-1.5 focus:outline-none focus:ring-2 focus:ring-blue-400 dark:border-blue-700 dark:bg-blue-900/30 dark:text-blue-100"
            [ngModel]="geo().municipality"
            (ngModelChange)="setGeo('municipality', $event)"
          />
        </label>
        <label class="col-span-2 text-xs text-blue-950 dark:text-blue-100"
          >Indirizzo
          <input
            class="mt-1 w-full rounded-lg border border-blue-200 px-2 py-1.5 focus:outline-none focus:ring-2 focus:ring-blue-400 dark:border-blue-700 dark:bg-blue-900/30 dark:text-blue-100"
            [ngModel]="geo().address"
            (ngModelChange)="setGeo('address', $event)"
          />
        </label>
      </div>
    </div>

    <!-- UTILITÀ -->
    <div
      class="rounded-xl border border-blue-200 bg-white/90 p-3 dark:bg-blue-900/20 dark:border-blue-700"
    >
      <h3 class="mb-2 font-medium text-blue-900 dark:text-blue-100">Utilità</h3>
      <div class="space-y-2 text-sm text-blue-950 dark:text-blue-100">
        <label class="flex items-center gap-2">
          <input
            type="checkbox"
            class="size-4"
            [ngModel]="uti().hasElevator"
            (ngModelChange)="setUti('hasElevator', $event)"
          />
          Ascensore
        </label>
        <label class="flex items-center gap-2">
          <input
            type="checkbox"
            class="size-4"
            [ngModel]="uti().hasDoorman"
            (ngModelChange)="setUti('hasDoorman', $event)"
          />
          Portiere
        </label>
        <label class="flex items-center gap-2">
          <input
            type="checkbox"
            class="size-4"
            [ngModel]="uti().hasAirConditioning"
            (ngModelChange)="setUti('hasAirConditioning', $event)"
          />
          Aria condizionata
        </label>
      </div>
    </div>

    <!-- CATASTALI -->
    <div
      class="rounded-xl border border-blue-200 bg-white/90 p-3 dark:bg-blue-900/20 dark:border-blue-700"
    >
      <h3 class="mb-2 font-medium text-blue-900 dark:text-blue-100">
        Filtri catastali
      </h3>
      <div
        class="grid grid-cols-2 gap-2 text-xs text-blue-950 dark:text-blue-100"
      >
        <label
          >Prezzo min
          <input
            type="number"
            min="1"
            class="mt-1 w-full rounded-lg border border-blue-200 px-2 py-1.5 focus:outline-none focus:ring-2 focus:ring-blue-400 dark:border-blue-700 dark:bg-blue-900/30 dark:text-blue-100"
            [ngModel]="cf().minPrice"
            (ngModelChange)="setCf('minPrice', $event)"
          />
        </label>
        <label
          >Prezzo max
          <input
            type="number"
            min="1"
            class="mt-1 w-full rounded-lg border border-blue-200 px-2 py-1.5 focus:outline-none focus:ring-2 focus:ring-blue-400 dark:border-blue-700 dark:bg-blue-900/30 dark:text-blue-100"
            [ngModel]="cf().maxPrice"
            (ngModelChange)="setCf('maxPrice', $event)"
          />
        </label>

        <label
          >MQ min
          <input
            type="number"
            min="1"
            class="mt-1 w-full rounded-lg border border-blue-200 px-2 py-1.5 focus:outline-none focus:ring-2 focus:ring-blue-400 dark:border-blue-700 dark:bg-blue-900/30 dark:text-blue-100"
            [ngModel]="cf().minSquareMeters"
            (ngModelChange)="setCf('minSquareMeters', $event)"
          />
        </label>
        <label
          >MQ max
          <input
            type="number"
            min="1"
            class="mt-1 w-full rounded-lg border border-blue-200 px-2 py-1.5 focus:outline-none focus:ring-2 focus:ring-blue-400 dark:border-blue-700 dark:bg-blue-900/30 dark:text-blue-100"
            [ngModel]="cf().maxSquareMeters"
            (ngModelChange)="setCf('maxSquareMeters', $event)"
          />
        </label>

        <label
          >Classe en. min
          <select
            class="mt-1 w-full rounded-lg border border-blue-200 px-2 py-1.5 focus:outline-none focus:ring-2 focus:ring-blue-400 dark:border-blue-700 dark:bg-blue-900/30 dark:text-blue-100"
            [ngModel]="cf().minEnergyClass"
            (ngModelChange)="setCf('minEnergyClass', $event)"
          >
            <option [ngValue]="1">A4</option>
            <option [ngValue]="2">A3</option>
            <option [ngValue]="3">A2</option>
            <option [ngValue]="4">A1</option>
            <option [ngValue]="5">B</option>
            <option [ngValue]="6">C</option>
            <option [ngValue]="7">D</option>
            <option [ngValue]="8">E</option>
            <option [ngValue]="9">F</option>
            <option [ngValue]="10">G</option>
          </select>
        </label>

        <label
          >Classe en. max
          <select
            class="mt-1 w-full rounded-lg border border-blue-200 px-2 py-1.5 focus:outline-none focus:ring-2 focus:ring-blue-400 dark:border-blue-700 dark:bg-blue-900/30 dark:text-blue-100"
            [ngModel]="cf().maxEnergyClass"
            (ngModelChange)="setCf('maxEnergyClass', $event)"
          >
            <option [ngValue]="1">A4</option>
            <option [ngValue]="2">A3</option>
            <option [ngValue]="3">A2</option>
            <option [ngValue]="4">A1</option>
            <option [ngValue]="5">B</option>
            <option [ngValue]="6">C</option>
            <option [ngValue]="7">D</option>
            <option [ngValue]="8">E</option>
            <option [ngValue]="9">F</option>
            <option [ngValue]="10">G</option>
          </select>
        </label>

        <label
          >Stanze min
          <input
            type="number"
            min="1"
            class="mt-1 w-full rounded-lg border border-blue-200 px-2 py-1.5 focus:outline-none focus:ring-2 focus:ring-blue-400 dark:border-blue-700 dark:bg-blue-900/30 dark:text-blue-100"
            [ngModel]="cf().minRooms"
            (ngModelChange)="setCf('minRooms', $event)"
          />
        </label>
        <label
          >Stanze max
          <input
            type="number"
            min="1"
            class="mt-1 w-full rounded-lg border border-blue-200 px-2 py-1.5 focus:outline-none focus:ring-2 focus:ring-blue-400 dark:border-blue-700 dark:bg-blue-900/30 dark:text-blue-100"
            [ngModel]="cf().maxRooms"
            (ngModelChange)="setCf('maxRooms', $event)"
          />
        </label>

        <label
          >Piano min
          <input
            type="number"
            min="1"
            class="mt-1 w-full rounded-lg border border-blue-200 px-2 py-1.5 focus:outline-none focus:ring-2 focus:ring-blue-400 dark:border-blue-700 dark:bg-blue-900/30 dark:text-blue-100"
            [ngModel]="cf().minFloor"
            (ngModelChange)="setCf('minFloor', $event)"
          />
        </label>
        <label
          >Piano max
          <input
            type="number"
            min="1"
            class="mt-1 w-full rounded-lg border border-blue-200 px-2 py-1.5 focus:outline-none focus:ring-2 focus:ring-blue-400 dark:border-blue-700 dark:bg-blue-900/30 dark:text-blue-100"
            [ngModel]="cf().maxFloor"
            (ngModelChange)="setCf('maxFloor', $event)"
          />
        </label>
      </div>
    </div>
  </div>

  <footer class="mt-4 flex flex-wrap items-center gap-3">
    <select
      class="rounded-lg border border-blue-200 px-2 py-1.5 bg-white dark:bg-blue-900/30 dark:border-blue-700 dark:text-blue-100"
      [(ngModel)]="category"
    >
      <option value="SALE">Vendita</option>
      <option value="RENT">Affitto</option>
    </select>
  </footer>
</section>
