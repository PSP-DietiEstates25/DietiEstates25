<nav
  class="w-full px-8 py-2 flex items-center justify-between bg-transparent fixed top-0 left-0 z-50"
>
  <!-- Desktop menu -->
  <div class="hidden md:flex gap-2">
    @for (item of navLinks; track item.path) {
    <a
      [routerLink]="item.path"
      routerLinkActive="active-link"
      [routerLinkActiveOptions]="{ exact: true }"
      class="px-5 py-2 rounded-xl font-bold text-base transition text-gray-800 hover:bg-purple-100 hover:text-purple-700 [&.active-link]:bg-purple-600 [&.active-link]:text-white"
    >
      {{ item.label }}
    </a>
    }
  </div>

  <!-- Hamburger button (mobile) -->
  <button
    (click)="mobileMenuOpen = !mobileMenuOpen"
    class="md:hidden p-2 rounded hover:bg-gray-200 transition"
    aria-label="Open menu"
  >
    @if (!mobileMenuOpen) {
    <!-- Hamburger Icon -->
    <svg
      class="w-7 h-7 text-purple-700"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      viewBox="0 0 24 24"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M4 8h16M4 16h16"
      />
    </svg>
    } @if (mobileMenuOpen) {
    <!-- Close Icon -->
    <svg
      class="w-7 h-7 text-purple-700"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      viewBox="0 0 24 24"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M6 18L18 6M6 6l12 12"
      />
    </svg>
    }
  </button>

  <!-- Center: logo -->
 <div class="absolute left-1/2 top-[55%] -translate-x-1/2 -translate-y-1/2 flex flex-col items-center">
  <!-- Logo MOBILE -->
  <img src="assets/logo2.svg" alt="Logo Mobile" class="block sm:hidden h-10" />
  <!-- Logo DESKTOP -->
  <img src="assets/logo.svg" alt="Logo Desktop" class="hidden sm:block h-12 lg:h-12" />
</div>

  <!-- Right: User icon -->
  <div class="flex items-center gap-6">
    <!-- Notifiche -->
    <a
      routerLink="/notifications"
      routerLinkActive="active-link"
      class="text-gray-800 hover:text-purple-700 transition"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="currentColor"
        viewBox="0 0 24 24"
        class="w-7 h-7 text-gray-700"
      >
        <path
          d="M18 16v-5a6 6 0 00-5-5.92V4a1 1 0 10-2 0v1.08A6 6 0 006 11v5l-1.29 1.29A1 1 0 006 19h12a1 1 0 00.71-1.71L18 16zM12 22a2 2 0 002-2h-4a2 2 0 002 2z"
        />
      </svg>
    </a>
    <button class="text-purple-700 hover:text-blue-800 text-2xl">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="currentColor"
        class="w-5 h-5"
        viewBox="0 0 16 16"
      >
        <path
          d="M3 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1H3zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"
        />
      </svg>
    </button>
  </div>
</nav>

<!-- Mobile Menu Dropdown -->
@if (mobileMenuOpen) {
<div class="md:hidden fixed top-16 left-0 w-full bg-white/90 shadow-lg z-40">
  <div class="flex flex-col gap-2 py-4 px-6">
    @for (item of navLinks; track item.path) {
    <a
      [routerLink]="item.path"
      (click)="mobileMenuOpen = false"
      routerLinkActive="active-link"
      [routerLinkActiveOptions]="{ exact: true }"
      class="block px-4 py-2 rounded-lg font-semibold text-gray-800 mb-3 transition [&.active-link]:bg-purple-600 [&.active-link]:text-white hover:bg-purple-50 hover:text-purple-700"
    >
      {{ item.label }}
    </a>
    }
    <div class="flex gap-4 mt-2 border-t border-gray-200 pt-3">
      <a
        routerLink="/notifications"
        class="text-gray-700 hover:text-purple-700"
      >
      </a>
    </div>
  </div>
</div>
}
