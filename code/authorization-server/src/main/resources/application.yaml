server:
  port: 9443
  ssl:
    bundle: authorization-server
    client-auth: want

spring:
  application:
    name: authorization-server
  ssl:
    bundle:
      jks:
        demo-authorizationserver:
          key:
            alias: authorization-server-sample
            password: password
          keystore:
            location: classpath:keystore.p12
            password: password
            type: PKCS12
          truststore:
            location: classpath:keystore.p12
            password: password
            type: PKCS12
  datasource:
    url: jdbc:postgresql://localhost:5432/dietiestates_authorization_server
    username: dietiestates
    password: dietiestates
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  security:
    oauth2:
      client:
        registration:
          google-idp:
            provider: google
            client-id: 817273458156-ljdvlbv3bl3ekjhm3m98fo40am16j5hf.apps.googleusercontent.com
            client-secret: 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
            scope: openid, https://www.googleapis.com/auth/userinfo.profile, https://www.googleapis.com/auth/userinfo.email
            client-name: Sign in with Google
          github-idp:
            provider: github
            client-id: Ov23linKVInaiBsIezOM
            client-secret: ef0669c73ab5433a3afff298bd6db896fac2ee01
            scope: user:email, read:user
            client-name: Sign in with GitHub
        provider:
          google:
            issuer-uri: https://accounts.google.com
            user-name-attribute: email
          github:
            user-name-attribute: login

